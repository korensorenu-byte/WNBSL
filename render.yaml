# Render Blueprint for WNBSLS. In Render: New > Blueprint > select this repo.
# Render then asks for ADMIN_EMAIL and ADMIN_PASSWORD (the first administrator login).
databases:
  - name: wnbsls-db
    databaseName: wnbsls
    user: wnbsls
    # Free databases expire after 30 days. Use a paid plan before entering real member data.
    plan: free

services:
  - type: web
    name: wnbsls
    runtime: node
    plan: free            # free web services sleep when idle; the first visit can take ~30 seconds
    healthCheckPath: /api/health
    buildCommand: npm --prefix server install && npm --prefix web install && npm --prefix web run build
    # Migrations and seed are idempotent: safe to run on every start.
    startCommand: npm --prefix server run migrate && npm --prefix server run seed && npm --prefix server start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: wnbsls-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"    # Render's internal database connection does not use TLS
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
