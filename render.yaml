# Render Blueprint for WNBSLS (web service only).
# The database is hosted on Neon, so no Render database is created here.
# Set DATABASE_URL to your Neon connection string in the service's Environment tab.
services:
  - type: web
    name: wnbsls
    runtime: node
    plan: free            # free web services sleep when idle; the first visit can take ~30 seconds
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    # Migrations and seed are idempotent: safe to run on every start.
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false       # paste the Neon connection string in the Render dashboard
      - key: DATABASE_SSL
        value: "true"     # Neon requires SSL
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
