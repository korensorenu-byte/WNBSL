# Fly.io configuration. Change `app` to a unique name before running `fly launch`.
app = "wnbsls"
primary_region = "syd"

[build]

[env]
  PORT = "8080"
  DATABASE_SSL = "false"   # Fly's internal network connection does not use TLS

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # keep the app running so staff are not kept waiting
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
